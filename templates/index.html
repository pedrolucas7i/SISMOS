<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SISMOS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/popup.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cems.css') }}">
</head>

<body>

    <header id="topbar">

        <div class="left-side">

            <div class="logo">

                <i class="bi bi-activity"></i>

                <div>

                    <h1>SISMOS</h1>

                    <small>Instituto Português do Mar e da Atmosfera</small>

                </div>

            </div>

        </div>

        <div class="top-info">

            <div class="info-card">

                <i class="bi bi-broadcast-pin"></i>

                <div>

                    <span>Sismos</span>

                    <strong id="total-sismos">0</strong>

                </div>

            </div>

            <div class="info-card cems-card" title="Ativações Copernicus EMS (sismos)">
                <i class="bi bi-satellite">🛰️</i>
                <div>
                    <span>CEMS</span>
                    <strong id="total-cems">0</strong>
                </div>
            </div>

            <button id="menu-btn" title="Menu">
                <i class="bi bi-list"></i>
            </button>

        </div>

    </header>

    <nav id="sidebar">
        <ul>

            <li>
                <i class="bi bi-house"></i>
                Início
            </li>

            <li>
                <i class="bi bi-map"></i>
                Mapa
            </li>

            <li>
                <i class="bi bi-fire"></i>
                Heatmap
            </li>

            <li>
                <i class="bi bi-download"></i>
                Exportar
            </li>

            <li>
                <i class="bi bi-info-circle"></i>
                Sobre
            </li>

        </ul>

    </nav>

    <div id="sidebar-overlay"></div>

    <div id="loading">

        <div class="spinner"></div>

        <p>A carregar sismos...</p>

    </div>

    <div id="container">

        <div id="map"></div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const menuBtn = document.getElementById("menu-btn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebar-overlay");

        function atualizarBotao() {

            const icon = menuBtn.querySelector("i");

            if (sidebar.classList.contains("open")) {

                icon.className = "bi bi-x-lg";
                menuBtn.title = "Fechar menu";

            } else {

                icon.className = "bi bi-list";
                menuBtn.title = "Abrir menu";

            }

        }

        function abrirMenu() {

            sidebar.classList.add("open");
            overlay.classList.add("show");

            atualizarBotao();

        }

        function fecharMenu() {

            sidebar.classList.remove("open");
            overlay.classList.remove("show");

            atualizarBotao();

        }

        function atualizarBotao() {

            const icon = menuBtn.querySelector("i");

            if (sidebar.classList.contains("open")) {

                icon.className = "bi bi-x-lg";
                menuBtn.classList.add("active");

            } else {

                icon.className = "bi bi-list";
                menuBtn.classList.remove("active");

            }

        }

        menuBtn.addEventListener("click", () => {

            if (sidebar.classList.contains("open")) {
                fecharMenu();
            } else {
                abrirMenu();
            }

        });

        overlay.addEventListener("click", fecharMenu);

        atualizarBotao();
    </script>

    <script src="{{ url_for('static', filename='js/leaflet-heat.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cems.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>

</html>
